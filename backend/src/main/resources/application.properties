 spring.application.name=lr_new_server

server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

spring.data.mongodb.host=${MONGO_HOST:127.0.0.1}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=LrNew
spring.data.mongodb.username=${MONGO_USERNAME:zsb}
spring.data.mongodb.password=${MONGO_PASSWORD:123456}


spring.data.redis.database=0
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-wait=-1
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.timeout=8000

llm.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.api.key=${LLM_API_KEY:}
llm.model=qwen-plus
llm.timeout-seconds=30

# Qwen 多模态语音模型（流畅度评分用）。Omni 系列只支持 OpenAI 兼容 + streaming
llm.audio.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
llm.audio.model=qwen3.5-omni-plus
llm.audio.timeout-seconds=120

baidu.api.app-id=${BAIDU_APP_ID:}
baidu.api.key=${BAIDU_API_KEY:}
baidu.api.client-secret=${BAIDU_CLIENT_SECRET:}

flytek.api.app-id=${FLYTEK_APP_ID:}
flytek.api.key=${FLYTEK_API_KEY:}
flytek.api.client-secret=${FLYTEK_CLIENT_SECRET:}

# 用 origin patterns 支持任意端口的 localhost / 127.0.0.1（覆盖 Flutter Web 随机端口、devtools）
# 生产请通过 APP_CORS_ALLOWED_ORIGIN_PATTERNS 显式覆盖
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}

jwt.secret=${JWT_SECRET:}

# 后端公网/局域网主机名，用于拼接给前端的静态资源 URL（音频 / 图片）
# 开发：默认 localhost；部署时用 APP_HOST 环境变量覆盖（如 api.example.com）
app.host=${APP_HOST:localhost}

# Python LLM FastAPI 微服务地址（与 LLM/app.py 的 --port 保持一致）
llm.service.url=${LLM_SERVICE_URL:http://127.0.0.1:8001}